[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-reliability"
version = "0.1.0"
description = "Reproducible evaluation of direct, CoT, verified, and adaptive LLM reasoning"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "transformers>=4.51", "datasets>=2.18", "accelerate>=0.28",
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11",
  "matplotlib>=3.8", "PyYAML>=6.0", "tqdm>=4.66", "streamlit>=1.32"
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.43"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads and runs a real model"]

[tool.ruff]
line-length = 100

